resilience4j:
  circuitbreaker:
    instances:
      recommendationCB:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      recommendationCB:
        timeout-duration: 3s

server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          # Also allows calling a service directly as /PRODUCT-SERVICE/api/products
          # for quick debugging, in addition to the explicit routes below.
          enabled: true
          lower-case-service-id: true
      routes:
        - id: product-service-route
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/gateway/products/**
          filters:
            - RewritePath=/gateway/products/(?<segment>.*), /api/products/$\{segment}
            - RewritePath=/gateway/products, /api/products

        - id: inventory-service-route
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/gateway/inventory/**
          filters:
            - RewritePath=/gateway/inventory/(?<segment>.*), /api/inventory/$\{segment}
            - RewritePath=/gateway/inventory, /api/inventory

        - id: recommendation-service-route
          uri: lb://RECOMMENDATION-SERVICE
          predicates:
            - Path=/gateway/recommendations/**
          filters:
            - RewritePath=/gateway/recommendations/(?<segment>.*), /api/recommendations/$\{segment}
            - name: CircuitBreaker
              args:
                name: recommendationCB
                
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
